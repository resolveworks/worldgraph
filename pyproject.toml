[project]
name = "worldgraph"
version = "0.1.0"
description = "Cross-source structural matching for knowledge extraction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.1",
    "pydantic-ai-slim[openai]>=2.42.0",
    "pydantic-evals>=2.42.0",
    "rapidfuzz>=3.14.3",
]

[project.scripts]
worldgraph = "worldgraph.cli:cli"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["worldgraph", "evals"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py312"
