# Expected extractions, one case per fixture article, ordered as a
# ladder: one sentence / one fact, then one construction each, then a
# short multi-fact article, then a paraphrase pair (two independent
# goldens). Entities are exact names (leading article stripped); facts
# are recursive subject/predicate/object surface forms in the expected
# convention: short active-voice base-form predicates, qualifiers as
# statements about the statement they qualify, pronouns resolved.
# Goldens encode the expected model, not current extractor output.
name: extraction-fixtures
cases:
- name: dismiss
  inputs:
    article: dismiss
    expected:
      entities:
      - Kestrel Bank
      - Marta Reyes
      facts:
      - subject: Kestrel Bank
        predicate: dismiss
        object: Marta Reyes
- name: passive
  inputs:
    article: passive
    expected:
      entities:
      - Marta Reyes
      - Kestrel Bank
      facts:
      - subject: Kestrel Bank
        predicate: dismiss
        object: Marta Reyes
- name: qualifier
  inputs:
    article: qualifier
    expected:
      entities:
      - Jane Okafor
      - Supercorp
      - chief reporter
      facts:
      - subject: Jane Okafor
        predicate: work at
        object: Supercorp
      - subject:
          subject: Jane Okafor
          predicate: work at
          object: Supercorp
        predicate: as
        object: chief reporter
- name: denial
  inputs:
    article: denial
    expected:
      entities:
      - minister
      - Kestrel Bank
      - losses
      facts:
      - subject: Kestrel Bank
        predicate: hide
        object: losses
      - subject: minister
        predicate: deny
        object:
          subject: Kestrel Bank
          predicate: hide
          object: losses
