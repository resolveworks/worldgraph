# Cross-article merge expectations. Each case pairs two fixture articles
# (stems under fixtures/). An expectation pairs a term in article A with a
# term in article B, located by surface form: an entity by name, a
# statement as subject/predicate/object where endpoints that are
# themselves statements nest the same way. `expected_merges` must end up
# in one union-find group after matching; `expected_non_merges` must not.
name: cross-article-merges
cases:
- name: role_qualifiers
  inputs:
    article_a: role_qualifiers
    article_b: role_qualifiers_paraphrase
    expected_merges:
    - a: Tessa Corin
      b: Tessa Corin
    - a: Halden Freight
      b: Halden Freight
    - a: Meridian Rail
      b: Meridian Rail
    - a:
        subject: Tessa Corin
        predicate: manage
        object: Halden Freight
      b:
        subject: Tessa Corin
        predicate: oversee
        object: Halden Freight
    - a:
        subject: Tessa Corin
        predicate: manage
        object: Meridian Rail
      b:
        subject: Tessa Corin
        predicate: lead
        object: Meridian Rail
    expected_non_merges:
    - a:
        subject: Tessa Corin
        predicate: manage
        object: Halden Freight
      b:
        subject: Tessa Corin
        predicate: lead
        object: Meridian Rail
    - a:
        subject: Tessa Corin
        predicate: manage
        object: Meridian Rail
      b:
        subject: Tessa Corin
        predicate: oversee
        object: Halden Freight
- name: appositive_roles
  inputs:
    article_a: appositive_roles
    article_b: appositive_roles_paraphrase
    expected_merges:
    - a:
        subject: Marisol Vaneck
        predicate: visit
        object: Vesterby
      b:
        subject: Marisol Vaneck
        predicate: travel to
        object: Vesterby
    - a:
        subject: Ivo Brandt
        predicate: join
        object:
          subject: Marisol Vaneck
          predicate: visit
          object: Vesterby
      b:
        subject: Ivo Brandt
        predicate: take part in
        object:
          subject: Marisol Vaneck
          predicate: travel to
          object: Vesterby
    - a: foreign minister
      b: foreign minister
    - a: deputy trade minister
      b: deputy trade minister
    expected_non_merges:
    - a: foreign minister
      b: deputy trade minister
- name: direction_flip
  inputs:
    article_a: direction_flip
    article_b: direction_flip_reversed
    expected_merges:
    - a: Grellmark Council
      b: Grellmark Council
    - a: Harwick district
      b: Harwick district
    expected_non_merges:
    - a:
        subject: Grellmark Council
        predicate: govern
        object: Harwick district
      b:
        subject: Harwick district
        predicate: govern
        object: Grellmark Council
- name: qualifier_disagreement
  inputs:
    article_a: qualifier_disagreement
    article_b: qualifier_disagreement_variant
    expected_merges:
    - a:
        subject: Solberg Energy
        predicate: run
        object: Norrfield wind farm
      b:
        subject: Solberg Energy
        predicate: operate
        object: Norrfield wind farm
    - a: Solberg Energy
      b: Solberg Energy
    - a: Norrfield wind farm
      b: Norrfield wind farm
    expected_non_merges:
    - a:
        subject: Solberg Energy
        predicate: be headquartered in
        object: Malmen
      b:
        subject: Solberg Energy
        predicate: be headquartered in
        object: Rydal
    - a: Malmen
      b: Rydal
